<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ОСВ{% endblock %}</title>
  <link rel="stylesheet" href="/static/styles.css?v={{ asset_version }}">
</head>
<body class="{% if active_nav == 'bdr' %}layout-wide{% endif %}{% if active_nav == 'dashboard' %} layout-dashboard{% endif %}">
  <div class="app-layout">
    <aside class="side-panel">
      <nav class="side-nav" aria-label="Основная навигация">
        <a class="side-nav__link {% if active_nav == 'dashboard' %}is-active{% endif %}" href="/">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>
          <span>Дашборд</span>
        </a>
        <a class="side-nav__link {% if active_nav == 'bdr' %}is-active{% endif %}" href="/bdr">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5"/><path d="M4 19h16"/><path d="M7 15l4-4 3 2 5-6"/></svg>
          <span>БДР</span>
        </a>
        <a class="side-nav__link {% if active_nav == 'general' %}is-active{% endif %}" href="/general">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M9 10v10"/></svg>
          <span>Общая</span>
        </a>
        <a class="side-nav__link {% if active_nav == 'mapping' %}is-active{% endif %}" href="/mapping">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
          <span>Мэппинг</span>
        </a>
        <a class="side-nav__link {% if active_nav == 'upload' %}is-active{% endif %}" href="/upload">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 18a4 4 0 0 1-.6-8A6 6 0 0 1 18 9.5a3.5 3.5 0 0 1 0 8.5H7z"/><path d="M12 15V9M9.5 11.5 12 9l2.5 2.5"/></svg>
          <span>Загрузка</span>
        </a>
      </nav>
    </aside>

    <div class="app-main">
      <header class="topbar">
        <div class="topbar__inner">
          <button class="icon-btn sidebar-toggle" id="sidebar-toggle" type="button" aria-label="Скрыть меню" aria-expanded="true">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <a class="brand" href="/">ОСВ</a>
          <a class="icon-btn" href="/general" title="Поиск по данным" aria-label="Поиск по данным">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m16.5 16.5 4 4"/></svg>
          </a>
        </div>
      </header>

      <main class="page{% if active_nav == 'bdr' %} page--wide{% endif %}">
        {% if ok %}<div class="flash flash--ok">{{ ok }}</div>{% endif %}
        {% if err %}<div class="flash flash--err">{{ err }}</div>{% endif %}
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>

  <script src="/static/app.js?v={{ asset_version }}"></script>
</body>
</html>
